# dsh-codex-image-bridge — bundle patch layer
#
# This file is the bundle's configuration layer: when a profile lists
# `dsh-codex-image-bridge` in its `dsh.profile.bundles` (installed with
# `dsh plugin --profile <name> add dsh-codex-image-bridge`), this patch is
# applied and the plugin row references the INSTALLED PACKAGE by name, so
# Node module resolution finds the pre-built code.
#
# Local development overlay (no install needed):
#   - insert:
#       - id: codex-image-bridge
#         name: '/absolute/path/to/dsh-codex-image/src/index.ts'
#   then: dsh web --patch ./cordis.patch.yml
#
# All config fields are optional — defaults come from the plugin Config schema
# and its environment fallbacks (CODEX_THREAD_MODEL, CODEX_COMMAND,
# CODEX_IMAGE_SANDBOX, CODEX_VISION_MODEL).
- insert:
    - id: codex-image-bridge
      name: dsh-codex-image-bridge
